# True color + undercurl support
set -g default-terminal "xterm-256color"
set -ga terminal-overrides ",xterm-256color:RGB:Tc"
setenv -g COLORTERM "truecolor"

# Start windows/panes at 1 (easier to hit on keyboard)
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on

# Faster key response
set -sg escape-time 10

# Larger scrollback
set -g history-limit 50000

# Mouse on
set -g mouse on

# vi-style copy mode
setw -g mode-keys vi
bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi y send -X copy-pipe-and-cancel

# More intuitive splits (keep current path)
bind '|' split-window -h -c "#{pane_current_path}"
bind '-' split-window -v -c "#{pane_current_path}"
unbind '"'
unbind %

# Reload config
bind r source-file ~/.config/tmux/tmux.conf \; display "Config reloaded"

# Respawn the current pane (re-run the original command after it exited)
bind R respawn-pane -k

# Plugins (TPM)
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'tmux-plugins/tmux-yank'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'
set -g @plugin 'christoomey/vim-tmux-navigator'

# Continuum: auto-save every 15 min. Restore manually with prefix + Ctrl-r.
set -g @continuum-save-interval '15'

# Resurrect: save pane contents too
set -g @resurrect-capture-pane-contents 'on'

# Keep this line at the very bottom
run '~/.tmux/plugins/tpm/tpm'
