plugins:
  debug-node:
    shortCut: s
    description: Run a debug pod on node
    scopes:
      - nodes
    command: bash
    background: false
    args:
      - -c
      - "POD=$(kubectl debug node/$NAME --image=alpine --profile=general -- sleep 3600 2>&1 | awk '/Creating debugging pod/ {print $4}'); kubectl wait --for=condition=Ready pod/$POD --timeout=60s; kubectl exec -it $POD -- chroot /host sh -c 'command -v bash >/dev/null 2>&1 && exec bash || exec sh'; kubectl delete pod/$POD --ignore-not-found"
